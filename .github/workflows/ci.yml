# Vigil CI.
#
# Both jobs run against real service containers, not sqlite/mongomock
# stand-ins -- `test` against a real Postgres + a real Mongo, and
# `ui-e2e` additionally drives a real headless Chromium against the
# actually-running API and dashboard. Learned from a previous project
# in this portfolio (OpsPilot) that the bare `pytest` console script
# does not add the working directory to sys.path the way
# `python -m pytest` does -- service/pytest.ini's `pythonpath = .`
# is in place from the start this time rather than discovered as a
# CI failure.
#
# Mongo's service container deliberately has no `--health-cmd`: the
# first attempt at this workflow used `mongosh --eval ...` as the
# health check, and the run failed with no usable log detail (GitHub's
# log-blob host is blocked by this project's sandbox proxy, so the
# failure had to be root-caused from the workflow's own structure
# rather than its output). Whether the official `mongo` image actually
# bundles `mongosh` turns out to depend on the tag and isn't something
# worth gambling CI on, so readiness is instead polled from outside
# with the same real pymongo client the service uses -- the "Wait for
# Mongo" step below -- which needs nothing assumed to be present
# inside the container image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Service + model — real Postgres & Mongo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vigil_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: service/requirements-dev.txt

      - run: pip install -r service/requirements-dev.txt

      - name: Wait for Mongo to accept real connections
        run: |
          python - <<'EOF'
          import sys, time
          import pymongo
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  pymongo.MongoClient("mongodb://localhost:27017", serverSelectionTimeoutMS=2000).admin.command("ping")
                  print("Mongo is up")
                  sys.exit(0)
              except Exception as exc:
                  print(f"waiting for Mongo: {exc}")
                  time.sleep(2)
          sys.exit("Mongo never became reachable")
          EOF

      - name: Generate the synthetic alert dataset
        run: python model/generate_data.py

      - name: Train the model (real GradientBoostingClassifier, real SHAP explainer)
        run: python model/train.py

      - name: Run tests — real Postgres, real Mongo, real trained model
        working-directory: service
        env:
          VIGIL_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/vigil_test
          VIGIL_MONGO_BACKEND: real
          VIGIL_MONGO_URI: mongodb://localhost:27017
          VIGIL_MODEL_PATH: ../model/artifacts/model.joblib
        run: pytest -v

      - name: Upload trained model + metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: model/artifacts/

      - name: Show service container logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do
            echo "== logs: $(docker inspect --format '{{.Config.Image}}' "$c") =="
            docker logs "$c" 2>&1 | tail -100
          done

  ui-e2e:
    name: Dashboard — real browser against the real running service
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vigil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: service/requirements-dev.txt

      - run: pip install -r service/requirements-dev.txt playwright==1.49.0
      - run: playwright install --with-deps chromium

      - name: Wait for Mongo to accept real connections
        run: |
          python - <<'EOF'
          import sys, time
          import pymongo
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  pymongo.MongoClient("mongodb://localhost:27017", serverSelectionTimeoutMS=2000).admin.command("ping")
                  print("Mongo is up")
                  sys.exit(0)
              except Exception as exc:
                  print(f"waiting for Mongo: {exc}")
                  time.sleep(2)
          sys.exit("Mongo never became reachable")
          EOF

      - name: Generate data + train model
        run: |
          python model/generate_data.py
          python model/train.py

      - name: Start the API
        working-directory: service
        env:
          VIGIL_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/vigil
          VIGIL_MONGO_BACKEND: real
          VIGIL_MONGO_URI: mongodb://localhost:27017
          VIGIL_MODEL_PATH: ../model/artifacts/model.joblib
        run: |
          nohup uvicorn vigil.main:app --host 127.0.0.1 --port 8010 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8010/health && break; sleep 1; done

      - name: Serve the dashboard
        working-directory: dashboard
        run: |
          nohup python3 -m http.server 8011 --bind 127.0.0.1 > /tmp/dash.log 2>&1 &
          for i in $(seq 1 10); do curl -sf http://127.0.0.1:8011/ -o /dev/null && break; sleep 1; done

      - name: Run the real browser verification
        run: python dashboard/verify_dashboard.py

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "== API log ==" && cat /tmp/api.log || true
          echo "== dashboard log ==" && cat /tmp/dash.log || true
