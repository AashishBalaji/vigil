# Vigil CI.
#
# Both jobs run against real service containers, not sqlite/mongomock
# stand-ins -- `test` against a real Postgres + a real Mongo, and
# `ui-e2e` additionally drives a real headless Chromium against the
# actually-running API and dashboard. Learned from a previous project
# in this portfolio (OpsPilot) that the bare `pytest` console script
# does not add the working directory to sys.path the way
# `python -m pytest` does -- service/pytest.ini's `pythonpath = .`
# is in place from the start this time rather than discovered as a
# CI failure.
#
# Mongo's service container deliberately has no `--health-cmd`: the
# first attempt at this workflow used `mongosh --eval ...` as the
# health check, and the run failed with no usable log detail (GitHub's
# log-blob host is blocked by this project's sandbox proxy, so the
# failure had to be root-caused from the workflow's own structure
# rather than its output). Whether the official `mongo` image actually
# bundles `mongosh` turns out to depend on the tag and isn't something
# worth gambling CI on, so readiness is instead polled from outside
# with the same real pymongo client the service uses -- the "Wait for
# Mongo" step below -- which needs nothing assumed to be present
# inside the container image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Service + model — real Postgres & Mongo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vigil_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: service/requirements-dev.txt

      - run: pip install -r service/requirements-dev.txt

      # Everything from here through the test run is one step, piped
      # through `tee` into a single log file. This project's sandbox
      # can't download GitHub's log blobs (blocked by its own egress
      # proxy -- confirmed, not assumed), so a prior run's failure had
      # no usable detail beyond "exit code 1" and had to be root-caused
      # blind, from the workflow's structure alone. Capturing a single
      # combined log here is what lets the "Post failure log as a
      # commit comment" step below actually hand back real output
      # through the plain REST API (api.github.com), which isn't
      # blocked, instead of the blob-storage log host, which is.
      - name: Generate data, train model, run tests
        working-directory: .
        env:
          VIGIL_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/vigil_test
          VIGIL_MONGO_BACKEND: real
          VIGIL_MONGO_URI: mongodb://localhost:27017
          VIGIL_MODEL_PATH: ../model/artifacts/model.joblib
        run: |
          set -o pipefail
          {
            python - <<'EOF'
          import sys, time
          import pymongo
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  pymongo.MongoClient("mongodb://localhost:27017", serverSelectionTimeoutMS=2000).admin.command("ping")
                  print("Mongo is up")
                  break
              except Exception as exc:
                  print(f"waiting for Mongo: {exc}")
                  time.sleep(2)
          else:
              sys.exit("Mongo never became reachable")
          EOF
            python model/generate_data.py
            python model/train.py
            cd service && pytest -v
          } 2>&1 | tee /tmp/ci_combined.log

      - name: Upload trained model + metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: model/artifacts/

      - name: Post failure log as a commit comment
        if: failure()
        run: |
          {
            echo "== docker ps -a =="
            docker ps -a
            for c in $(docker ps -aq); do
              echo "== docker logs: $(docker inspect --format '{{.Config.Image}}' "$c") =="
              docker logs "$c" 2>&1 | tail -80
            done
            echo "== combined job output (tail) =="
            tail -c 55000 /tmp/ci_combined.log
          } > /tmp/failure_report.txt
          python - <<'EOF'
          import json, os, urllib.request

          with open("/tmp/failure_report.txt") as f:
              body = f.read()
          body = "```\n" + body[-60000:] + "\n```"

          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"token {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.status, resp.read().decode()[:200])
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ui-e2e:
    name: Dashboard — real browser against the real running service
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vigil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: service/requirements-dev.txt

      - run: pip install -r service/requirements-dev.txt playwright==1.49.0
      - run: playwright install --with-deps chromium

      - name: Wait for Mongo to accept real connections
        run: |
          python - <<'EOF'
          import sys, time
          import pymongo
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  pymongo.MongoClient("mongodb://localhost:27017", serverSelectionTimeoutMS=2000).admin.command("ping")
                  print("Mongo is up")
                  sys.exit(0)
              except Exception as exc:
                  print(f"waiting for Mongo: {exc}")
                  time.sleep(2)
          sys.exit("Mongo never became reachable")
          EOF

      - name: Generate data + train model
        run: |
          python model/generate_data.py
          python model/train.py

      - name: Start the API
        working-directory: service
        env:
          VIGIL_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/vigil
          VIGIL_MONGO_BACKEND: real
          VIGIL_MONGO_URI: mongodb://localhost:27017
          VIGIL_MODEL_PATH: ../model/artifacts/model.joblib
        run: |
          nohup uvicorn vigil.main:app --host 127.0.0.1 --port 8010 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8010/health && break; sleep 1; done

      - name: Serve the dashboard
        working-directory: dashboard
        run: |
          nohup python3 -m http.server 8011 --bind 127.0.0.1 > /tmp/dash.log 2>&1 &
          for i in $(seq 1 10); do curl -sf http://127.0.0.1:8011/ -o /dev/null && break; sleep 1; done

      - name: Run the real browser verification
        run: python dashboard/verify_dashboard.py

      - name: Post failure log as a commit comment
        if: failure()
        run: |
          {
            echo "== docker ps -a =="
            docker ps -a
            for c in $(docker ps -aq); do
              echo "== docker logs: $(docker inspect --format '{{.Config.Image}}' "$c") =="
              docker logs "$c" 2>&1 | tail -80
            done
            echo "== API log =="
            cat /tmp/api.log || true
            echo "== dashboard log =="
            cat /tmp/dash.log || true
          } > /tmp/failure_report.txt
          python - <<'EOF'
          import json, os, urllib.request

          with open("/tmp/failure_report.txt") as f:
              body = f.read()
          body = "```\n" + body[-60000:] + "\n```"

          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"token {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.status, resp.read().decode()[:200])
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
