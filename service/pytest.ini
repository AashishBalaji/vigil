[pytest]
# Learned the hard way on a previous project (OpsPilot): the bare
# `pytest` console script does not add the working directory to
# sys.path the way `python -m pytest` does, so `from vigil...` would
# fail in CI even if it happened to pass locally under a different
# invocation. Setting this here up front rather than discovering it
# via a failed CI run a second time.
pythonpath = .
